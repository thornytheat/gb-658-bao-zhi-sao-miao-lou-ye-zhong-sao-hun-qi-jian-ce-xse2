<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{{ title }} · 扫描期版质检台</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/layout.css">
  <link rel="stylesheet" href="/static/components.css">
</head>
<body class="receipt-shell" data-endpoint="{{ endpoint }}">
<div class="app">
  <aside class="rail">
    <a class="rail__brand" href="/">SCANFOLIO</a>
    <nav class="rail__nav">
<a class="rail__item" href="/intake"><span>01</span>清单采信</a>
<a class="rail__item" href="/issues"><span>02</span>期版契约</a>
<a class="rail__item" href="/pages"><span>03</span>页码序列</a>
<a class="rail__item" href="/rescans"><span>04</span>重扫判定</a>
<a class="rail__item" href="/mixed"><span>05</span>混期归因</a>
<a class="rail__item" href="/batches"><span>06</span>批次对账</a>
    </nav>
    <div class="rail__foot">{{ version }}<br>RUN READY</div>
  </aside>
  <div class="work">
    <header class="topbar">
      <strong>{{ title }}</strong>
      <span class="topbar__meta">RUN-20261116 · ASIA/SHANGHAI</span>
      <button class="btn btn--primary" id="run">运行样例</button>
    </header>
    <main class="content">{% block content %}{% endblock %}</main>
    <footer class="statusbar"><span>校验位 7F · 待归档</span><span id="feedback">就绪</span></footer>
  </div>
</div>
<script src="/static/app.js"></script>
<script src="/static/table.js"></script>
</body>
</html>
